name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Wiki structure
        run: python omoikane/bin/wiki-lint.py
      - name: Index is current
        run: |
          python omoikane/bin/wiki-index.py
          git diff --exit-code omoikane/index.md
